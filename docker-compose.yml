# ==============================================================================
# BLUE SENTINEL - Tactical C4ISR Unified Multi-Container Stack
# ==============================================================================

version: '3.8'

services:
  # 1. Python AI/ML Telemetry & Neural Anomaly Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blue-sentinel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - KERAS_BACKEND=torch
      - PORT=8000
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sentinel-mesh

  # 2. 3D CesiumJS Tactical Console (Node/Vite)
  frontend:
    image: node:20-slim
    container_name: blue-sentinel-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws/telemetry
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentinel-mesh

networks:
  sentinel-mesh:
    driver: bridge
