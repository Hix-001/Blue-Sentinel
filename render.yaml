services:
  - type: web
    name: blue-sentinel-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KERAS_BACKEND
        value: torch
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AISSTREAM_API_KEY
        sync: false
